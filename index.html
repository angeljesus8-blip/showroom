<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Catálogo 3D — Odemás Angelópolis</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --rojo:#D12026;
    --naranja:#F37021;
    --azul:#336BB4;
    --tinta:#1c1f26;
    --gris:#6b7280;
    --linea:#e7e9ee;
    --fondo:#ffffff;
    --sombra:0 2px 10px rgba(28,31,38,.06), 0 12px 34px rgba(28,31,38,.07);
    --tipo:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--tipo);
    color:var(--tinta);
    background:var(--fondo);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ── Encabezado ── */
  header{
    display:flex; align-items:center; gap:14px;
    padding:14px 22px;
    border-bottom:1px solid var(--linea);
    flex:none;
  }
  header img{height:38px;width:auto;display:block}
  header .barra{width:1px;height:30px;background:var(--linea)}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--gris);font-weight:500}

  /* ── Visor 3D ── */
  .visor{
    position:relative;
    flex:1 1 auto;
    /* El equipo manda: nunca cede más de la mitad de la pantalla a la ficha */
    min-height:48vh;
    background:
      radial-gradient(120% 78% at 50% 16%, #ffffff 0%, #f4f5f8 58%, #e9ebf0 100%);
  }
  .visor canvas{display:block;width:100%;height:100%}

  .pista{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(6px);
    border:1px solid var(--linea);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px; font-weight:600; color:var(--gris);
    pointer-events:none;
    transition:opacity .5s;
  }
  .pista.oculta{opacity:0}
  .pista svg{width:17px;height:17px;fill:none;stroke:var(--naranja);stroke-width:1.9}

  .vistas{
    position:absolute; top:14px; right:14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .vistas button{
    width:52px;height:44px;
    border:1px solid var(--linea);
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(6px);
    border-radius:13px;
    font-family:var(--tipo);
    font-size:10.5px;font-weight:700;color:var(--gris);
    letter-spacing:.02em;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .vistas button:active{transform:scale(.94);border-color:var(--naranja);color:var(--naranja)}

  .cinta{
    position:absolute; top:16px; left:16px;
    background:var(--rojo); color:#fff;
    font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:7px 13px; border-radius:8px;
    box-shadow:0 4px 14px rgba(209,32,38,.28);
  }
  .cinta.oculta{display:none}

  .rotulos{
    position:absolute; inset:auto 0 14px 0;
    display:none; justify-content:center; gap:0;
    pointer-events:none;
  }
  .rotulos.on{display:flex}
  .rotulos span{
    flex:1; text-align:center;
    font-size:13.5px; font-weight:700; color:var(--tinta);
  }
  .rotulos span small{display:block;font-size:11.5px;font-weight:600;color:var(--gris);margin-top:2px}

  /* ── Ficha ── */
  .ficha{
    /* Cede altura cuando no alcanza (tabla de comparación larga) en vez de
       desbordarse por debajo y encimarse con el carrusel: el panel hace scroll. */
    flex:0 1 auto;
    position:relative;
    border-top:1px solid var(--linea);
    padding:16px 22px 0;
    background:#fff;
    max-height:47vh;
    display:flex; flex-direction:column;
    min-height:0;
  }

  .cabecera{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
  .marca{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--gris);text-transform:uppercase}
  .nombre{margin:3px 0 0;font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
  .gancho{margin:6px 0 0;font-size:14px;color:var(--gris);font-weight:500;max-width:44ch;line-height:1.4}

  .precio{text-align:right;flex:none;white-space:nowrap}
  .precio .lista{font-size:15px;color:var(--gris);font-weight:600}
  .precio .lista.tachado{text-decoration:line-through;text-decoration-color:var(--rojo);text-decoration-thickness:2px}
  .precio .final{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
  .precio .final.oferta{color:var(--rojo)}
  .precio .nota{font-size:11px;color:var(--gris);font-weight:600;margin-top:3px}
  .precio .sinprecio{
    font-size:13.5px;font-weight:700;color:var(--azul);line-height:1.35;
    background:#f2f6fc;border:1px solid #d9e4f3;border-radius:12px;padding:10px 15px;
  }

  .aviso{
    margin-top:12px;
    display:none; align-items:center; gap:9px;
    background:#fff8ec; border:1px solid #f6dcb4;
    border-radius:11px; padding:9px 13px;
    font-size:12.5px; font-weight:600; color:#8a5a12;
  }
  .aviso.on{display:flex}

  /* Colores */
  .colores{display:flex;align-items:center;gap:11px;margin-top:15px;flex-wrap:wrap}
  .colores .et{font-size:12px;font-weight:700;color:var(--gris);letter-spacing:.04em;text-transform:uppercase;margin-right:2px}
  .swatch{
    width:38px;height:38px;border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 0 0 1.5px var(--linea), 0 2px 6px rgba(0,0,0,.12);
    cursor:pointer;transition:.16s;padding:0;
  }
  .swatch.sel{box-shadow:0 0 0 2.5px var(--naranja), 0 2px 8px rgba(0,0,0,.16);transform:scale(1.08)}
  .colores .nomcolor{font-size:13px;font-weight:600;color:var(--tinta);margin-left:4px}

  /* Pestañas */
  .tabs{display:flex;gap:26px;margin-top:16px;border-bottom:1px solid var(--linea);flex:none}
  .tabs button{
    background:none;border:none;padding:0 0 11px;
    font-family:var(--tipo);font-size:14.5px;font-weight:700;color:var(--gris);
    cursor:pointer;position:relative;letter-spacing:-.01em;
  }
  .tabs button.sel{color:var(--tinta)}
  .tabs button.sel::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;
    background:var(--naranja);border-radius:3px 3px 0 0;
  }

  .panel{flex:1 1 auto;overflow-y:auto;padding:14px 0 16px;-webkit-overflow-scrolling:touch}
  .panel[hidden]{display:none}

  /* Desvanece el corte cuando la lista sigue más abajo (en tablets bajitas) */
  .ficha::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:24px;
    background:linear-gradient(to top,#fff 20%,rgba(255,255,255,0));
    pointer-events:none;
  }

  /* Características */
  .specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 26px}
  .specs div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--linea)}
  .specs dt{font-size:13.5px;font-weight:600;color:var(--gris)}
  .specs dd{margin:0;font-size:13.5px;font-weight:700;text-align:right}

  /* Comparar */
  .comp-elige{font-size:13px;font-weight:700;color:var(--gris);margin:0 0 10px}
  .comp-lista{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .comp-lista button{
    border:1.5px solid var(--linea);background:#fff;border-radius:10px;
    padding:8px 14px;font-family:var(--tipo);font-size:13px;font-weight:700;color:var(--gris);
    cursor:pointer;transition:.15s;
  }
  .comp-lista button.sel{border-color:var(--azul);color:var(--azul);background:#f2f6fc}
  .tabla-comp{width:100%;border-collapse:collapse;font-size:13.5px}
  .tabla-comp th{
    text-align:left;font-weight:800;font-size:13px;padding:8px 10px;
    border-bottom:2px solid var(--linea);
  }
  .tabla-comp th:nth-child(2){color:var(--naranja)}
  .tabla-comp th:nth-child(3){color:var(--azul)}
  .tabla-comp td{padding:9px 10px;border-bottom:1px solid var(--linea);font-weight:600}
  .tabla-comp td:first-child{color:var(--gris);font-weight:600}
  .tabla-comp td:not(:first-child){font-weight:700}

  /* ── Carrusel de equipos ── */
  .carrusel{
    flex:none;
    display:flex;gap:11px;
    padding:13px 22px calc(13px + env(safe-area-inset-bottom));
    overflow-x:auto;
    border-top:1px solid var(--linea);
    background:#fbfbfc;
    scrollbar-width:none;
  }
  .carrusel::-webkit-scrollbar{display:none}
  .tarjeta{
    flex:none;width:104px;
    border:1.5px solid var(--linea);border-radius:15px;background:#fff;
    padding:11px 9px 10px;cursor:pointer;transition:.16s;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .tarjeta.sel{border-color:var(--naranja);box-shadow:0 0 0 2px rgba(243,112,33,.16)}
  .tarjeta:active{transform:scale(.96)}
  .mini{
    width:34px;height:56px;border-radius:8px;position:relative;flex:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.13), 0 2px 5px rgba(0,0,0,.14);
  }
  .mini.tablet{width:46px;height:58px;border-radius:6px}
  .mini::after{
    content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;
    background:rgba(0,0,0,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .tarjeta span{font-size:11.5px;font-weight:700;line-height:1.25;text-align:center;letter-spacing:-.01em}
  .tarjeta small{font-size:10.5px;font-weight:700;color:var(--rojo)}

  /* Tablets de 1024 px o menos: se aprieta la ficha para que el equipo se vea grande */
  @media (max-height:1100px){
    .ficha{padding-top:13px}
    .nombre{font-size:24px}
    .precio .final{font-size:27px}
    .gancho{font-size:13px;margin-top:4px}
    .tabs{margin-top:13px}
    .colores{margin-top:12px}
    .specs div{padding:7px 0}
  }
  @media (max-height:780px){
    .nombre{font-size:22px}
    .precio .final{font-size:24px}
    .ficha{padding-top:11px}
    .gancho{display:none}
    .aviso{padding:7px 11px;font-size:12px}
    .swatch{width:34px;height:34px}
  }
  /* Envuelve visor + ficha para poder acomodarlos en fila si la tablet se pone horizontal */
  .cuerpo{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}

  @media (orientation:landscape) and (min-width:900px){
    .cuerpo{flex-direction:row}
    .ficha{max-height:none;width:42%;border-top:none;border-left:1px solid var(--linea)}
    .gancho{display:block}
  }
</style>
</head>
<body>

<header>
  <img src="logo_odemas.png" alt="Odemás">
  <div class="barra"></div>
  <div>
    <h1>Catálogo ampliado</h1>
    <p>Equipos que manejamos aunque no estén en exhibición · Angelópolis</p>
  </div>
</header>

<div class="cuerpo">

<section class="visor" id="visor">
  <canvas id="lienzo"></canvas>
  <div class="cinta oculta" id="cinta"></div>
  <div class="vistas">
    <button data-vista="frente">FRENTE</button>
    <button data-vista="lado">3/4</button>
    <button data-vista="dorso">DORSO</button>
  </div>
  <div class="rotulos" id="rotulos"></div>
  <div class="pista" id="pista">
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M17 9l3 3-3 3"/><path d="M7 15l-3-3 3-3"/></svg>
    Gíralo con el dedo
  </div>
</section>

<section class="ficha">
  <div class="cabecera">
    <div>
      <p class="marca" id="marca"></p>
      <h2 class="nombre" id="nombre"></h2>
      <p class="gancho" id="gancho"></p>
    </div>
    <div class="precio" id="precio"></div>
  </div>

  <div class="aviso" id="aviso">
    <span>⚠️</span><span>Ficha técnica por confirmar — verifica con tu asesor antes de cerrar la venta.</span>
  </div>

  <div class="colores" id="colores"></div>

  <div class="tabs">
    <button data-tab="specs" class="sel">Características</button>
    <button data-tab="comparar">Comparar</button>
  </div>

  <div class="panel" id="panel-specs">
    <dl class="specs" id="specs"></dl>
  </div>

  <div class="panel" id="panel-comparar" hidden>
    <p class="comp-elige">Elige con cuál compararlo:</p>
    <div class="comp-lista" id="comp-lista"></div>
    <table class="tabla-comp" id="tabla-comp"></table>
  </div>
</section>

</div>

<nav class="carrusel" id="carrusel"></nav>

<script src="catalogo.js"></script>
<script type="module">
import { crearEscena, construirEquipo, liberar, Orbita, THREE } from './modelo3d.js';

/* ── Estado ─────────────────────────────────────────────── */
const EQUIPOS = window.CATALOGO;
let iEquipo = 0;       // equipo mostrado
let iColor  = 0;       // color elegido
let iRival  = null;    // segundo equipo en modo comparar (null = apagado)
let tab     = 'specs';

const $ = s => document.querySelector(s);
const lienzo = $('#lienzo');

/* ── Escena ─────────────────────────────────────────────── */
const { scene, camera, renderer, piso, redimensionar, render } = crearEscena(lienzo);
const orbita = new Orbita(lienzo, camera, { radio: 62 });
let mallaA = null, mallaB = null;

const eq = () => EQUIPOS[iEquipo];
const rival = () => (iRival === null ? null : EQUIPOS[iRival]);

/** Calcula a qué distancia poner la cámara para que quepa todo con aire. */
function encuadrar() {
  const caja = new THREE.Box3();
  if (mallaA) caja.expandByObject(mallaA);
  if (mallaB) caja.expandByObject(mallaB);
  if (caja.isEmpty()) return;

  const tam = caja.getSize(new THREE.Vector3());
  const centro = caja.getCenter(new THREE.Vector3());

  const fovV = camera.fov * Math.PI / 180;
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
  // Al comparar se deja más aire: abajo van los rótulos con el nombre y la altura.
  const comparando = iRival !== null;
  const margen = comparando ? 1.46 : 1.30;
  const profundidad = Math.max(tam.z, tam.x) / 2;

  const dV = (tam.y / 2) / Math.tan(fovV / 2);
  const dH = (Math.max(tam.x, tam.z) / 2) / Math.tan(fovH / 2);

  orbita.centro.set(centro.x, centro.y - (comparando ? tam.y * 0.07 : 0), 0);
  orbita.radio = Math.max(dV, dH) * margen + profundidad;
  orbita.radioMin = orbita.radio * 0.55;
  orbita.radioMax = orbita.radio * 1.9;

  piso.position.y = caja.min.y - 0.5;
}

/** Rehace los modelos en pantalla. */
function armar() {
  if (mallaA) { scene.remove(mallaA); liberar(mallaA); mallaA = null; }
  if (mallaB) { scene.remove(mallaB); liberar(mallaB); mallaB = null; }

  mallaA = construirEquipo(eq(), iColor);
  scene.add(mallaA);

  const r = rival();
  if (r) {
    mallaB = construirEquipo(r, 0);
    scene.add(mallaB);
    const sep = (mallaA.userData.ancho + mallaB.userData.ancho) / 2 + 1.6;
    mallaA.position.x = -sep / 2;
    mallaB.position.x = sep / 2;
  } else {
    mallaA.position.x = 0;
  }
  encuadrar();
}

/* ── Bucle ──────────────────────────────────────────────── */
function bucle() {
  orbita.actualizar();
  render();
  requestAnimationFrame(bucle);
}

/* ── Interfaz ───────────────────────────────────────────── */
const mxn = n => '$' + n.toLocaleString('es-MX');

/** El circulito de color también degrada, igual que el equipo. */
const fondoColor = c =>
  c.hex2 && c.hex2 !== c.hex ? `linear-gradient(135deg, ${c.hex} 0%, ${c.hex2} 100%)` : c.hex;

/** Fecha de HOY en local (nunca toISOString: México es UTC-6 y adelantaría el día por la tarde). */
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/** Precio vigente: respeta la fecha de fin de promoción. */
function precioDe(e) {
  const vence = (e.promoHasta || '').trim();
  const promoViva = e.promo && (!vence || vence >= hoyISO());
  return { lista: e.precio, final: promoViva ? e.promo : e.precio, hayPromo: !!promoViva };
}

function pintarFicha() {
  const e = eq();
  $('#marca').textContent = e.marca || '';
  $('#nombre').textContent = e.nombre;
  $('#gancho').textContent = e.gancho || '';

  const cinta = $('#cinta');
  cinta.textContent = e.etiqueta || '';
  cinta.classList.toggle('oculta', !e.etiqueta);

  $('#aviso').classList.toggle('on', !!e.verificar);

  // Precio
  const cajaPrecio = $('#precio');
  if (e.precio == null) {
    cajaPrecio.innerHTML = '<div class="sinprecio">Pregunta el precio<br>a tu asesor</div>';
  } else {
    const p = precioDe(e);
    const ahorro = p.hayPromo ? p.lista - p.final : 0;
    cajaPrecio.innerHTML = `
      <div class="lista ${p.hayPromo ? 'tachado' : ''}">${p.hayPromo ? mxn(p.lista) : 'Precio de lista'}</div>
      <div class="final ${p.hayPromo ? 'oferta' : ''}">${mxn(p.final)}</div>
      ${p.hayPromo ? `<div class="nota">Ahorras ${mxn(ahorro)}</div>` : ''}`;
  }

  // Colores
  const cc = $('#colores');
  cc.innerHTML = '<span class="et">Color</span>';
  e.colores.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === iColor ? ' sel' : '');
    b.style.background = fondoColor(c);
    b.title = c.n;
    b.setAttribute('aria-label', c.n);
    b.onclick = () => { iColor = i; armar(); pintarFicha(); pintarCarrusel(); };
    cc.appendChild(b);
  });
  const nom = document.createElement('span');
  nom.className = 'nomcolor';
  nom.textContent = e.colores[iColor]?.n || '';
  cc.appendChild(nom);

  // Características
  $('#specs').innerHTML = (e.specs || [])
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');

  pintarComparar();
  pintarRotulos();
}

function pintarComparar() {
  const lista = $('#comp-lista');
  lista.innerHTML = '';
  EQUIPOS.forEach((e, i) => {
    if (i === iEquipo) return;
    const b = document.createElement('button');
    b.textContent = e.nombre;
    b.className = i === iRival ? 'sel' : '';
    b.onclick = () => { iRival = (iRival === i ? null : i); armar(); pintarFicha(); };
    lista.appendChild(b);
  });

  const tabla = $('#tabla-comp');
  const r = rival();
  if (!r) { tabla.innerHTML = ''; return; }

  const a = eq();
  const filas = [];
  const claves = [...new Set([...(a.specs || []), ...(r.specs || [])].map(s => s[0]))];
  const busca = (e, k) => (e.specs || []).find(s => s[0] === k)?.[1] || '—';

  filas.push(['Tamaño', `${a.dim.h} × ${a.dim.w} mm`, `${r.dim.h} × ${r.dim.w} mm`]);
  filas.push(['Grosor', `${a.dim.t} mm`, `${r.dim.t} mm`]);
  claves.forEach(k => filas.push([k, busca(a, k), busca(r, k)]));
  // La fila de precio solo aparece si al menos uno lo tiene; si no, sobra.
  if (a.precio != null || r.precio != null) {
    filas.push([
      'Precio',
      a.precio != null ? mxn(precioDe(a).final) : '—',
      r.precio != null ? mxn(precioDe(r).final) : '—'
    ]);
  }

  tabla.innerHTML =
    `<tr><th></th><th>${a.nombre}</th><th>${r.nombre}</th></tr>` +
    filas.map(f => `<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('');
}

function pintarRotulos() {
  const cont = $('#rotulos');
  const r = rival();
  cont.classList.toggle('on', !!r);
  if (!r) { cont.innerHTML = ''; return; }
  const a = eq();
  cont.innerHTML =
    `<span>${a.nombre}<small>${a.dim.h} mm de alto</small></span>` +
    `<span>${r.nombre}<small>${r.dim.h} mm de alto</small></span>`;
}

function pintarCarrusel() {
  const c = $('#carrusel');
  c.innerHTML = '';
  EQUIPOS.forEach((e, i) => {
    const p = e.precio != null ? precioDe(e) : null;
    const t = document.createElement('button');
    t.className = 'tarjeta' + (i === iEquipo ? ' sel' : '');
    t.innerHTML =
      `<div class="mini ${e.tipo === 'tablet' ? 'tablet' : ''}" style="background:${fondoColor((i === iEquipo ? e.colores[iColor] : e.colores[0]) || {})}"></div>` +
      `<span>${e.nombre}</span>` +
      (p?.hayPromo ? `<small>OFERTA</small>` : '');
    t.onclick = () => {
      if (iRival === i) iRival = null;
      iEquipo = i; iColor = 0;
      armar(); pintarFicha(); pintarCarrusel();
      orbita.irA(0, 0);
    };
    c.appendChild(t);
  });
}

/* Pestañas */
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('sel', x === b));
    $('#panel-specs').hidden = tab !== 'specs';
    $('#panel-comparar').hidden = tab !== 'comparar';
  };
});

/* Vistas rápidas */
document.querySelectorAll('.vistas button').forEach(b => {
  b.onclick = () => {
    const v = b.dataset.vista;
    if (v === 'frente') orbita.irA(0, 0);
    if (v === 'lado') orbita.irA(0.55, 0.22);   // hacia el lado de los botones
    if (v === 'dorso') orbita.irA(Math.PI, 0);
  };
});

/* Pista "gíralo con el dedo": se va al primer toque */
const pista = $('#pista');
lienzo.addEventListener('pointerdown', () => pista.classList.add('oculta'), { once: true });
setTimeout(() => pista.classList.add('oculta'), 9000);

/* ── Modo kiosco: si nadie lo toca, vuelve al inicio ────── */
const ESPERA_REINICIO = 100000;   // 100 s
let ultimaActividad = Date.now();
['pointerdown', 'wheel', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => { ultimaActividad = Date.now(); }, { passive: true }));

setInterval(() => {
  if (Date.now() - ultimaActividad < ESPERA_REINICIO) return;
  const virgen = iEquipo === 0 && iColor === 0 && iRival === null && tab === 'specs';
  if (virgen) return;
  iEquipo = 0; iColor = 0; iRival = null;
  document.querySelector('.tabs button[data-tab="specs"]').click();
  armar(); pintarFicha(); pintarCarrusel();
  orbita.irA(0, 0);
  pista.classList.remove('oculta');
  ultimaActividad = Date.now();
}, 5000);

/* Evita que se salga del kiosco por gestos del navegador */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* Guarda la app en la tablet: si se cae el wifi de tienda, sigue abriendo */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
}

/* ── Arranque ───────────────────────────────────────────── */
/* El visor cambia de alto cuando la ficha crece o encoge (aviso, gancho largo,
   tablet girada). Un ResizeObserver lo sigue; con solo el evento 'resize' el
   lienzo se quedaba con el tamaño de antes de pintar y salía el equipo estirado. */
new ResizeObserver(() => { redimensionar(); encuadrar(); }).observe($('#visor'));
window.addEventListener('resize', () => { redimensionar(); encuadrar(); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { redimensionar(); encuadrar(); });

redimensionar();
armar();
pintarFicha();
pintarCarrusel();
bucle();
</script>
</body>
</html>
