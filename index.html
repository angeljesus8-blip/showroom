<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Catálogo 3D — Odemás Angelópolis</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --rojo:#D12026;
    --naranja:#F37021;
    --azul:#336BB4;
    --tinta:#1c1f26;
    --gris:#6b7280;
    --linea:#e7e9ee;
    --tipo:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--tipo);
    color:var(--tinta);
    background:#fff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ── Encabezado ── */
  header{
    display:flex; align-items:center; gap:14px;
    padding:13px 22px;
    border-bottom:1px solid var(--linea);
    flex:none;
  }
  header img{height:36px;width:auto;display:block}
  header .barra{width:1px;height:29px;background:var(--linea)}
  header h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--gris);font-weight:500}

  /* ── Visor oficial ── */
  .visor{
    position:relative;
    flex:1 1 auto;
    min-height:50vh;
    background:#f4f5f8;
  }
  .visor iframe{
    display:block;
    width:100%; height:100%;
    border:0;
  }

  /* Aviso cuando el visor no carga (sin internet o cambió la dirección) */
  .caido{
    position:absolute; inset:0;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:32px; text-align:center;
    background:#fff;
  }
  .caido.on{display:flex}
  .caido .icono{font-size:44px;line-height:1}
  .caido h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
  .caido p{margin:0;font-size:14.5px;color:var(--gris);font-weight:500;max-width:42ch;line-height:1.5}
  .caido button{
    margin-top:6px;
    border:none;border-radius:12px;
    background:var(--naranja);color:#fff;
    font-family:var(--tipo);font-size:15px;font-weight:700;
    padding:13px 26px;cursor:pointer;
  }
  .caido button:active{transform:scale(.97)}

  /* ── Ficha ── */
  .ficha{
    flex:0 1 auto;
    min-height:0;
    position:relative;
    border-top:1px solid var(--linea);
    padding:14px 22px 0;
    background:#fff;
    display:flex; flex-direction:column;
  }
  .ficha::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:22px;
    background:linear-gradient(to top,#fff 20%,rgba(255,255,255,0));
    pointer-events:none;
  }

  /* Selector de ficha. Va rotulado a propósito: el visor de arriba tiene su
     propio selector de modelo y no se pueden sincronizar (es de otro sitio). */
  .cual{display:flex;align-items:center;gap:9px;flex-wrap:wrap;flex:none}
  .cual .et{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--gris);text-transform:uppercase}
  .cual button{
    border:1.5px solid var(--linea);background:#fff;border-radius:11px;
    padding:9px 16px;font-family:var(--tipo);font-size:13.5px;font-weight:700;color:var(--gris);
    cursor:pointer;transition:.15s;
  }
  .cual button.sel{border-color:var(--naranja);color:var(--naranja);background:#fff7f2}

  .cabecera{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-top:13px;flex:none}
  .marca{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gris);text-transform:uppercase}
  .nombre{margin:3px 0 0;font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
  .gancho{margin:5px 0 0;font-size:13.5px;color:var(--gris);font-weight:500;max-width:46ch;line-height:1.4}
  .precio{
    flex:none;white-space:nowrap;
    font-size:13px;font-weight:700;color:var(--azul);line-height:1.35;text-align:right;
    background:#f2f6fc;border:1px solid #d9e4f3;border-radius:12px;padding:9px 14px;
  }
  .cinta{
    display:inline-block;margin-top:8px;
    background:var(--rojo);color:#fff;
    font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 11px;border-radius:7px;
  }
  .cinta:empty{display:none}

  .specs{
    flex:1 1 auto;overflow-y:auto;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:0 26px;margin-top:12px;padding-bottom:14px;
    -webkit-overflow-scrolling:touch;
  }
  .specs div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--linea)}
  .specs dt{font-size:13px;font-weight:600;color:var(--gris)}
  .specs dd{margin:0;font-size:13px;font-weight:700;text-align:right}

  @media (max-height:1100px){
    .nombre{font-size:22px}
    .specs div{padding:7px 0}
  }
  @media (max-height:780px){
    .gancho{display:none}
    .nombre{font-size:20px}
  }
  @media (orientation:landscape) and (min-width:900px){
    .cuerpo{flex-direction:row}
    .ficha{width:40%;border-top:none;border-left:1px solid var(--linea)}
    .gancho{display:block}
  }

  .cuerpo{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
</style>
</head>
<body>

<header>
  <img src="logo_odemas.png" alt="Odemás">
  <div class="barra"></div>
  <div>
    <h1>Catálogo ampliado</h1>
    <p>Equipos que manejamos aunque no estén en exhibición · Angelópolis</p>
  </div>
</header>

<div class="cuerpo">

  <section class="visor">
    <iframe id="visor3d"
            title="Visor 3D oficial HUAWEI"
            allow="accelerometer; gyroscope; xr-spatial-tracking"
            referrerpolicy="no-referrer-when-downgrade"></iframe>

    <div class="caido" id="caido">
      <div class="icono">📶</div>
      <h2>No se pudo abrir el visor 3D</h2>
      <p>La vista en 3D viene de la página de HUAWEI, así que necesita internet.
         Revisa que la tablet esté conectada al wifi de la tienda.</p>
      <button id="reintentar">Reintentar</button>
    </div>
  </section>

  <section class="ficha">
    <div class="cual" id="cual"><span class="et">Ficha técnica</span></div>

    <div class="cabecera">
      <div>
        <p class="marca" id="marca"></p>
        <h2 class="nombre" id="nombre"></h2>
        <p class="gancho" id="gancho"></p>
        <span class="cinta" id="cinta"></span>
      </div>
      <div class="precio">Pregunta el precio<br>a tu asesor</div>
    </div>

    <dl class="specs" id="specs"></dl>
  </section>

</div>

<script src="catalogo.js"></script>
<script>
/* ============================================================
   La vista 3D es el visor OFICIAL de HUAWEI, embebido tal cual
   (no se copia nada: lo sirve su propio proveedor). Por eso se
   ve idéntico al equipo real.

   Contrapartida: necesita internet y la dirección pertenece a
   una campaña ("2026q204"), así que puede cambiar. Si algún día
   deja de cargar, se cambia VISOR_3D por la nueva dirección.
   Se saca así: entra a la ficha del equipo en consumer.huawei.com,
   abre el visor 3D y mira el src del iframe.
   ============================================================ */
const VISOR_3D = 'https://meta.kivisense.com/project-h-2026q204-alpha/phone.html?lang=mx';

const $ = s => document.querySelector(s);
const EQUIPOS = window.CATALOGO;
let iEquipo = 0;

/* ── Visor ─────────────────────────────────────────────── */
const marco = $('#visor3d');
const caido = $('#caido');
let vigilante = null;

function cargarVisor() {
  caido.classList.remove('on');
  clearTimeout(vigilante);

  if (!navigator.onLine) { caido.classList.add('on'); return; }

  // Si en 20 s no terminó de cargar, se asume que no va a cargar.
  vigilante = setTimeout(() => caido.classList.add('on'), 20000);
  marco.src = VISOR_3D;
}

marco.addEventListener('load', () => clearTimeout(vigilante));
marco.addEventListener('error', () => caido.classList.add('on'));
$('#reintentar').onclick = cargarVisor;
window.addEventListener('online', cargarVisor);
window.addEventListener('offline', () => caido.classList.add('on'));

/* ── Ficha ─────────────────────────────────────────────── */
function pintar() {
  const e = EQUIPOS[iEquipo];
  $('#marca').textContent = e.marca || '';
  $('#nombre').textContent = e.nombre;
  $('#gancho').textContent = e.gancho || '';
  $('#cinta').textContent = e.etiqueta || '';
  $('#specs').innerHTML = (e.specs || [])
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');

  document.querySelectorAll('#cual button').forEach((b, i) =>
    b.classList.toggle('sel', i === iEquipo));
}

const cual = $('#cual');
EQUIPOS.forEach((e, i) => {
  const b = document.createElement('button');
  b.textContent = e.nombre;
  b.onclick = () => { iEquipo = i; pintar(); };
  cual.appendChild(b);
});

/* ── Modo kiosco ────────────────────────────────────────
   Tras un rato sin uso se recarga el visor, para que el
   siguiente cliente no lo encuentre girado y en otro color. */
const ESPERA = 100000;
let ultima = Date.now();
['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => { ultima = Date.now(); }, { passive: true }));

setInterval(() => {
  if (Date.now() - ultima < ESPERA) return;
  if (iEquipo === 0 && !caido.classList.contains('on')) {
    // ya está en el estado inicial de la ficha; solo se reinicia el visor
    cargarVisor();
  } else {
    iEquipo = 0; pintar(); cargarVisor();
  }
  ultima = Date.now();
}, 10000);

/* Evita que se salga del kiosco por gestos del navegador */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
}

cargarVisor();
pintar();
</script>
</body>
</html>
