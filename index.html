<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Catálogo 3D — Odemás Angelópolis</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --rojo:#D12026;
    --naranja:#F37021;
    --azul:#336BB4;
    --tinta:#1c1f26;
    --gris:#6b7280;
    --linea:#e7e9ee;
    --tipo:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--tipo);
    color:var(--tinta);
    background:#fff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ── Encabezado ── */
  header{
    display:flex; align-items:center; gap:14px;
    padding:13px 22px;
    border-bottom:1px solid var(--linea);
    flex:none;
  }
  header img{height:36px;width:auto;display:block}
  header .barra{width:1px;height:29px;background:var(--linea)}
  header h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--gris);font-weight:500}

  /* Va antes de las media queries: si se declara después, gana por orden
     y anula el acomodo en dos columnas del modo horizontal. */
  .cuerpo{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}

  /* ── Visor oficial ── */
  .visor{
    position:relative;
    flex:1 1 auto;
    min-height:56vh;
    /* Exactamente el gris de fondo del visor de HUAWEI (muestreado: 241,243,245).
       Si no coincide, se ve el recuadro del marco cuando no ocupa todo el ancho. */
    background:#f1f3f5;
    display:flex; align-items:center; justify-content:center;
  }
  /* El ancho lo fija el guion en función del alto: el visor de HUAWEI acomoda
     sus botones encima del equipo cuando el marco le queda ancho y bajo. */
  .visor iframe{
    display:block;
    height:100%;
    width:100%;
    border:0;
  }

  /* Aviso cuando el visor no carga (sin internet o cambió la dirección) */
  .caido{
    position:absolute; inset:0;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:32px; text-align:center;
    background:#fff;
  }
  .caido.on{display:flex}
  .caido .icono{font-size:44px;line-height:1}
  .caido h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
  .caido p{margin:0;font-size:14.5px;color:var(--gris);font-weight:500;max-width:42ch;line-height:1.5}
  .caido button{
    margin-top:6px;
    border:none;border-radius:12px;
    background:var(--naranja);color:#fff;
    font-family:var(--tipo);font-size:15px;font-weight:700;
    padding:13px 26px;cursor:pointer;
  }
  .caido button:active{transform:scale(.97)}

  /* ── Nubes de características ──
     Van FLOTANDO junto al equipo, translúcidas. La capa no intercepta el
     dedo (pointer-events:none) para que el cliente siga girando el equipo
     por debajo; solo las nubes en sí son tocables. */
  /* Del mismo ancho que el marco y centrada, no de toda la sección: si no,
     en pantalla ancha las nubes se van a las orillas, lejos del equipo.
     El ancho se lo pone el guion junto con el del marco. */
  .nubes{
    position:absolute; top:0; bottom:0; left:50%;
    transform:translateX(-50%);
    pointer-events:none;
    z-index:3;
  }
  .nube{
    position:absolute;
    pointer-events:auto;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 6px 26px rgba(28,31,38,.14), 0 1px 3px rgba(28,31,38,.08);
    border-radius:16px;
    padding:11px 17px;
    max-width:31%;
    opacity:0; transform:translateY(10px) scale(.94);
    transition:opacity .45s cubic-bezier(.2,.8,.3,1), transform .45s cubic-bezier(.2,.8,.3,1);
  }
  .nube.entra{opacity:1;transform:none}
  .nube .t{
    display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;
    color:var(--naranja);text-transform:uppercase;
  }
  .nube .v{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.25}

  /* Rótulo de a qué equipo pertenecen: el visor de arriba tiene su propio
     selector y no se puede sincronizar, así que conviene dejarlo claro. */
  .dequien{
    position:absolute; left:50%; top:12px; transform:translateX(-50%);
    background:rgba(28,31,38,.82); color:#fff;
    backdrop-filter:blur(8px);
    font-size:11.5px;font-weight:700;letter-spacing:.04em;
    padding:7px 15px;border-radius:999px;white-space:nowrap;
    opacity:0;transition:opacity .4s;
  }
  .dequien.entra{opacity:1}

  /* ── Tira de la ficha ── */
  .ficha{
    flex:none;
    position:relative;
    border-top:1px solid var(--linea);
    padding:11px 22px calc(11px + env(safe-area-inset-bottom));
    background:#fff;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .ficha .nom{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
  .ficha .nom small{
    display:block;font-size:11px;font-weight:700;letter-spacing:.12em;
    color:var(--gris);text-transform:uppercase;margin-bottom:1px;
  }
  .verchar{
    border:none;border-radius:13px;
    background:var(--naranja);color:#fff;
    font-family:var(--tipo);font-size:14.5px;font-weight:700;
    padding:12px 22px;cursor:pointer;transition:.15s;
    box-shadow:0 3px 12px rgba(243,112,33,.3);
  }
  .verchar:active{transform:scale(.96)}
  .verchar.activo{background:var(--tinta);box-shadow:none}

  /* Selector de equipo. Manda sobre la ficha Y sobre las nubes. */
  .cual{display:flex;align-items:center;gap:8px}
  .cual button{
    border:1.5px solid var(--linea);background:#fff;border-radius:11px;
    padding:9px 15px;font-family:var(--tipo);font-size:13px;font-weight:700;color:var(--gris);
    cursor:pointer;transition:.15s;
  }
  .cual button.sel{border-color:var(--naranja);color:var(--naranja);background:#fff7f2}

  .cinta{
    background:var(--rojo);color:#fff;
    font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 10px;border-radius:7px;
  }
  .cinta:empty{display:none}

  @media (max-width:700px){
    .ficha .nom{width:100%;margin-bottom:4px}
    .nube{max-width:38%}
    .nube .v{font-size:14px}
  }
</style>
</head>
<body>

<header>
  <img src="logo_odemas.png" alt="Odemás">
  <div class="barra"></div>
  <div>
    <h1>Catálogo ampliado</h1>
    <p>Equipos que manejamos aunque no estén en exhibición · Angelópolis</p>
  </div>
</header>

<div class="cuerpo">

  <section class="visor">
    <iframe id="visor3d"
            title="Visor 3D oficial HUAWEI"
            allow="accelerometer; gyroscope; xr-spatial-tracking"
            referrerpolicy="no-referrer-when-downgrade"></iframe>

    <div class="nubes" id="nubes"></div>
    <div class="dequien" id="dequien"></div>

    <div class="caido" id="caido">
      <div class="icono">📶</div>
      <h2>No se pudo abrir el visor 3D</h2>
      <p>La vista en 3D viene de la página de HUAWEI, así que necesita internet.
         Revisa que la tablet esté conectada al wifi de la tienda.</p>
      <button id="reintentar">Reintentar</button>
    </div>
  </section>

  <section class="ficha">
    <div class="nom">
      <small id="marca"></small>
      <span id="nombre"></span>
    </div>
    <span class="cinta" id="cinta"></span>
    <div class="cual" id="cual"></div>
    <button class="verchar" id="verchar">Ver características</button>
  </section>

</div>

<script src="catalogo.js"></script>
<script>
/* ============================================================
   La vista 3D es el visor OFICIAL de HUAWEI, embebido tal cual
   (no se copia nada: lo sirve su propio proveedor). Por eso se
   ve idéntico al equipo real.

   Contrapartida: necesita internet y la dirección pertenece a
   una campaña ("2026q204"), así que puede cambiar. Si algún día
   deja de cargar, se cambia VISOR_3D por la nueva dirección.
   Se saca así: entra a la ficha del equipo en consumer.huawei.com,
   abre el visor 3D y mira el src del iframe.
   ============================================================ */
const VISOR_3D = 'https://meta.kivisense.com/project-h-2026q204-alpha/phone.html?lang=mx';

const $ = s => document.querySelector(s);
const EQUIPOS = window.CATALOGO;
let iEquipo = 0;

/* ── Visor ─────────────────────────────────────────────── */
const marco = $('#visor3d');
const caido = $('#caido');
let vigilante = null;

function cargarVisor() {
  caido.classList.remove('on');
  clearTimeout(vigilante);

  if (!navigator.onLine) { caido.classList.add('on'); return; }

  // Si en 20 s no terminó de cargar, se asume que no va a cargar.
  vigilante = setTimeout(() => caido.classList.add('on'), 20000);
  marco.src = VISOR_3D;
}

/* El visor de HUAWEI acomoda su selector de modelo y de color encima del equipo
   cuando el marco le queda ancho y bajo. Se le limita el ancho en proporción a
   su alto para que siempre tenga sitio donde poner los botones. */
const seccionVisor = document.querySelector('.visor');
function ajustarMarco() {
  const alto = seccionVisor.clientHeight;
  const ancho = seccionVisor.clientWidth;
  if (!alto || !ancho) return;
  const util = Math.min(ancho, Math.round(alto * 1.05));
  marco.style.width = util + 'px';
  // Las nubes viven sobre el marco, no sobre toda la sección
  document.getElementById('nubes').style.width = util + 'px';
}
new ResizeObserver(ajustarMarco).observe(seccionVisor);
ajustarMarco();

marco.addEventListener('load', () => clearTimeout(vigilante));
marco.addEventListener('error', () => caido.classList.add('on'));
$('#reintentar').onclick = cargarVisor;
window.addEventListener('online', cargarVisor);
window.addEventListener('offline', () => caido.classList.add('on'));

/* ── Nubes de características ───────────────────────────
   No se puede saber dónde está el equipo dentro del visor (es de otro
   sitio), pero sí que queda centrado y que gira sobre su eje. Por eso las
   nubes van a los lados, en porcentajes: el centro siempre queda libre. */
const SITIOS = [
  { x: 5,  y: 14 },   // arriba izquierda
  { x: 66, y: 26 },   // arriba derecha
  { x: 3,  y: 44 },   // media izquierda
  { x: 68, y: 56 },   // media derecha
  { x: 6,  y: 72 }    // abajo izquierda
];

const capaNubes = $('#nubes');
const dequien = $('#dequien');
const botonChar = $('#verchar');
let nubesVisibles = false;
let animaciones = [];

function ocultarNubes() {
  animaciones.forEach(clearTimeout);
  animaciones = [];
  nubesVisibles = false;
  botonChar.classList.remove('activo');
  botonChar.textContent = 'Ver características';
  dequien.classList.remove('entra');
  capaNubes.querySelectorAll('.nube').forEach(n => n.classList.remove('entra'));
  setTimeout(() => { if (!nubesVisibles) capaNubes.innerHTML = ''; }, 500);
}

function mostrarNubes() {
  const e = EQUIPOS[iEquipo];
  const lista = (e.nubes && e.nubes.length ? e.nubes
    : (e.specs || []).slice(0, 5).map(([t, v]) => ({ t, v }))).slice(0, SITIOS.length);

  capaNubes.innerHTML = '';
  animaciones.forEach(clearTimeout);
  animaciones = [];

  lista.forEach((n, i) => {
    const d = document.createElement('div');
    d.className = 'nube';
    d.style.left = SITIOS[i].x + '%';
    d.style.top = SITIOS[i].y + '%';
    d.innerHTML = `<span class="t">${n.t}</span><span class="v">${n.v}</span>`;
    capaNubes.appendChild(d);
    // Van saliendo una tras otra, no todas de golpe
    animaciones.push(setTimeout(() => d.classList.add('entra'), 90 + i * 320));
  });

  dequien.textContent = `${e.marca || ''} ${e.nombre}`.trim();
  dequien.classList.add('entra');

  nubesVisibles = true;
  botonChar.classList.add('activo');
  botonChar.textContent = 'Ocultar';
}

botonChar.onclick = () => (nubesVisibles ? ocultarNubes() : mostrarNubes());

/* ── Ficha ─────────────────────────────────────────────── */
function pintar() {
  const e = EQUIPOS[iEquipo];
  $('#marca').textContent = e.marca || '';
  $('#nombre').textContent = e.nombre;
  $('#cinta').textContent = e.etiqueta || '';

  document.querySelectorAll('#cual button').forEach((b, i) =>
    b.classList.toggle('sel', i === iEquipo));

  // Si las nubes estaban puestas, se rehacen con las del equipo nuevo
  if (nubesVisibles) mostrarNubes();
}

const cual = $('#cual');
EQUIPOS.forEach((e, i) => {
  const b = document.createElement('button');
  b.textContent = e.nombre.replace(/^Pura\s*/i, '');
  b.title = e.nombre;
  b.onclick = () => { iEquipo = i; pintar(); };
  cual.appendChild(b);
});

/* ── Modo kiosco ────────────────────────────────────────
   Tras un rato sin uso se recarga el visor, para que el
   siguiente cliente no lo encuentre girado y en otro color. */
const ESPERA = 100000;
let ultima = Date.now();
let yaReiniciado = true;   // evita recargar el visor una y otra vez de noche

['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => { ultima = Date.now(); yaReiniciado = false; }, { passive: true }));

setInterval(() => {
  if (yaReiniciado || Date.now() - ultima < ESPERA) return;
  ocultarNubes();
  iEquipo = 0;
  pintar();
  cargarVisor();
  yaReiniciado = true;
}, 10000);

/* Evita que se salga del kiosco por gestos del navegador */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
}

cargarVisor();
pintar();
</script>
</body>
</html>
